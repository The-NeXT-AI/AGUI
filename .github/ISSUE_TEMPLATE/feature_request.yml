name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like AGUI Desktop to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any alternatives or tradeoffs you have considered?
  - type: dropdown
    id: surface
    attributes:
      label: Area
      options:
        - Electron app
        - Web runtime
        - Provider adapter
        - Extensions
        - MCP gateway
        - Docs
        - Other
